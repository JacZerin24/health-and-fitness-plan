<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071014" />
  <title>ShiftFit Dashboard</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=20260922g" />
  <link rel="stylesheet" href="visual-v4.css?v=20260922e" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">SF</div>
        <div><strong>ShiftFit</strong><span>adaptive recomp dashboard</span></div>
      </div>
      <nav id="nav">
        <div class="nav-section-label">Plan</div>
        <button data-view="today" data-title="Dashboard" class="active"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
        <button data-view="week" data-title="This week"><span class="nav-icon">◫</span><span>This week</span></button>
        <button data-view="schedule" data-title="Schedule"><span class="nav-icon">▦</span><span>Schedule</span></button>
        <button data-view="training" data-title="Training"><span class="nav-icon">◆</span><span>Training</span></button>
        <button data-view="nutrition" data-title="Nutrition"><span class="nav-icon">◉</span><span>Nutrition</span></button>
        <div class="nav-section-label">Trends</div>
        <button data-view="health" data-title="Health trends"><span class="nav-icon">⌁</span><span>Health trends</span></button>
        <button data-view="progress" data-title="Progress"><span class="nav-icon">↗</span><span>Progress</span></button>
        <button data-view="sync" data-title="Data & sync"><span class="nav-icon">⟳</span><span>Data & sync</span></button>
      </nav>
      <div class="privacy-note"><span class="sync-dot"></span> Auto-synced from Health + Calendar</div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <div class="eyebrow" id="todayDate"></div>
          <h1 id="pageTitle">Today</h1>
        </div>
        <div class="top-actions">
          <span id="dataStatus" class="pill muted">No private data loaded</span>
          <button id="quickWeight" class="secondary">Log weight</button>
        </div>
      </header>

      <section id="view-today" class="view active"></section>
      <section id="view-week" class="view"></section>
      <section id="view-schedule" class="view"></section>
      <section id="view-training" class="view"></section>
      <section id="view-nutrition" class="view"></section>
      <section id="view-health" class="view"></section>
      <section id="view-progress" class="view"></section>
      <section id="view-sync" class="view"></section>
    </main>
  </div>

  <dialog id="editDayDialog">
    <form method="dialog" id="editDayForm">
      <h3>Edit shift</h3>
      <p id="editDayLabel" class="muted-text"></p>
      <label>Shift
        <select id="editShiftSelect">
          <option value="OFF">OFF</option><option value="G">G · 6a–2p</option>
          <option value="I">I · 8a–4p</option><option value="X">X · supernumerary</option>
          <option value="K">K · 10a–6p</option><option value="M">M · 12p–8p</option>
          <option value="P">P · 2p–10p</option><option value="R">R · 4p–12a</option>
          <option value="W">W · 10p–6a</option><option value="A">A · 12a–8a</option>
        </select>
      </label>
      <div class="dialog-actions"><button value="cancel" class="secondary">Cancel</button><button value="save">Save</button></div>
    </form>
  </dialog>

  <input id="starterImport" type="file" accept="application/json" hidden />
  <input id="icsImport" type="file" accept=".ics,text/calendar" hidden />
  <script src="app.js?v=20260922g"></script>
</body>
</html>
