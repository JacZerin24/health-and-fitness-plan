name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify public data has no private records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data.json').read_text())
          for key in ('health', 'profile', 'scheduleOverrides', 'scheduleRanges', 'scheduleTimeOverrides', 'weightEntries'):
              if data.get(key):
                  raise SystemExit(f'Public data contains private {key}: refusing deploy')
          print('Public data privacy check passed')
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
